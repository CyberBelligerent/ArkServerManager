# ASA Server Cluster Manager — English (US) strings.
#
# This file is the source of truth for every UI string in the app. To
# translate the app, copy the file to ./language/<your-locale>.toml
# (relative to asamanager.exe) and translate the right-hand side of
# each "key = value" line. Keep the LEFT side (the key) unchanged.
#
# Substitution: any string containing "%s" / "%d" / "%q" / "%v" / "%w"
# uses Go's fmt.Sprintf to plug in runtime values. Keep the same number
# of placeholders in your translation, in the same order. The app will
# crash at runtime if the count is wrong.
#
# Quoting: TOML strings need their own quote rules. If your translation
# contains a double-quote, escape it with \" or use a triple-quoted
# multi-line string ("""like this""").
#
# Missing keys: anything not in this file falls back to the embedded
# en-us defaults. If your locale's file is missing a key entirely, the
# app shows "[your-locale:key.path]" so you can spot what's missing.

